name: Build SARA Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDK_MANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SARA-v0.5.0-aura-debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARA-v0.5.0-aura-debug
          path: SARA-v0.5.0-aura-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-aura-${{ github.run_number }}
          name: SARA Obsidian Aura & Instant AI v0.5.0 (Build #${{ github.run_number }})
          body: |
            SARA Personal AI Assistant — v0.5.0 Obsidian Aura Redesign & Ultra-Fast Reply Engine.
            - **Obsidian + Crimson Aura Design**: Sleek deep obsidian surfaces, multi-ring glowing Vortex Mic Orb, inline prompt composer, 2x2 dark gradient Bento cards, Today's Insight/Reply card, bottom navigation dock with floating center orb, and **Aura Control** visual theme switcher (`Crimson Aura`, `Cyan Matrix`, `Violet Pulse`, `Emerald Core`, `Midnight Blue`)
            - **Ultra-Fast AI Replies**: Low-thinking Gemini API optimization (`thinkingConfig: LOW/MINIMAL`), tightened HTTP timeouts, and instant `<5ms` zero-latency Bengali & English command/greeting responses
            - **Human Female Bengali Voice System**: 6 warm natural female voices (`Kore`, `Zephyr`, `Aoede`, `Leda`, `SaraSweet`, `SaraVelvet`) with 24kHz fidelity & disk WAV cache
            - **Outside-App Background Assistant**: Obsidian + Crimson floating bubble & expandable card over Android Home Screen + persistent DataStore settings
            - Package: `com.sara.assistant`
          files: SARA-v0.5.0-aura-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
