name: Build SARA Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDK_MANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SARA-v0.4.0-assistant-debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARA-v0.4.0-assistant-debug
          path: SARA-v0.4.0-assistant-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.0-assistant-${{ github.run_number }}
          name: SARA Outside-App Assistant & Light Hub v0.4.0 (Build #${{ github.run_number }})
          body: |
            SARA Personal AI Assistant — v0.4.0 Outside-App Assistant, Permanent DataStore & Light Hub APK.
            - **Outside-App Home Screen Assistant**: Continuous "Hey SARA" wake-word Foreground Service, speaker responses, Talk/Pause/Resume/Stop controls, draggable floating SARA bubble & compact expandable overlay card (`SYSTEM_ALERT_WINDOW`), and boot auto-restore (`SaraBootReceiver`)
            - **Permanent Settings Persistence (Jetpack DataStore)**: Every preference, permission snapshot, memory note, conversation turn, and inbox message persists across restarts/updates, plus an explicit user-triggered Reset Settings option
            - **Crisp Light-Only Theme**: Dark mode removed completely; crisp white cards, soft blue gradients, and cyan accents throughout
            - **Feature Button Hub Settings & Dedicated Sub-Pages**: Clean button grid for every SARA capability opening dedicated sub-pages
            - **6 Beautiful Female Bengali Voices**: Kore, Zephyr, Aoede, Leda, SaraSweet & SaraVelvet with individual live preview buttons
            - **Dedicated SARA Inbox**: Stores outside-app replies, voice responses, and custom reminders with unread counter & speak-aloud support
            - Package: `com.sara.assistant`
          files: SARA-v0.4.0-assistant-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
