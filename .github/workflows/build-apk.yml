name: Build SARA Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDK_MANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SARA-v0.3.1-voice-debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARA-v0.3.1-voice-debug
          path: SARA-v0.3.1-voice-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1-voice-${{ github.run_number }}
          name: SARA Natural Female Bengali Voice (Build #${{ github.run_number }})
          body: |
            SARA Personal AI Assistant — Natural Human Female Bengali Voice Upgrade APK.
            - Upgraded Voice System to Gemini 3.8 Neural TTS (`gemini-3.8-flash-tts` with `gemini-3.8-flash-lite-tts` fallback)
            - Natural, warm, sweet human female Bengali personas: `Kore` (Sweet, Warm & Caring) and `Zephyr` (Soft, Gentle & Calm) with live voice preview
            - Natural Bengali & English pronunciation with breathing pauses and smooth intonation
            - Smart Android Native TTS fallback ranking high-quality `bn-BD` / `bn-IN` network & neural female voices
            - All existing UI, colors, buttons, layouts, AI Profile, and 10-Module Settings preserved intact
            - Package: `com.sara.assistant`
          files: SARA-v0.3.1-voice-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
