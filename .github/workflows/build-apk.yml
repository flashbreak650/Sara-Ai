name: Build SARA Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDK_MANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SARA-v0.4.1-voice-debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARA-v0.4.1-voice-debug
          path: SARA-v0.4.1-voice-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.1-voice-${{ github.run_number }}
          name: SARA Natural Human Female Bengali Voice v0.4.1 (Build #${{ github.run_number }})
          body: |
            SARA Personal AI Assistant — v0.4.1 Voice System Upgrade APK.
            - **Upgraded Human Female Bengali Voice System**: Gemini 3.8 Neural TTS (`gemini-3.8-flash-lite-tts` via `generateContent`) with 6 warm female Bengali personas (`Kore`, `Zephyr`, `Aoede`, `Leda`, `SaraSweet` -> `Despina`, `SaraVelvet` -> `Sulafat`)
            - **Bit-Exact 24kHz Fidelity**: Default 1.0x speed eliminates WSOLA time-stretching metallic artifacts; AudioFocus ducking and sentence prefetching with natural breathing pauses
            - **Bilingual Bengali & English Diction**: Markdown stripping, Bengali abbreviation expansion (`ডা.`, `কি.মি.`, `৳`), and seamless English pronunciation
            - **Offline Neural Fallback Fix**: Fixed Bangladesh Google female voice (`bn-bd-x-ban-*`) selection and added inter-sentence breathing pauses via `playSilentUtterance`
            - **Disk WAV Cache**: Instant replay for voice previews (`শুনুন`), Test Voice, and wake acknowledgments
            - Package: `com.sara.assistant`
          files: SARA-v0.4.1-voice-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
