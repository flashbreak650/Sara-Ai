name: Build SARA Android APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          SDK_MANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK artifact name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SARA-v0.5.0-aura-debug.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARA-v0.5.0-aura-debug
          path: SARA-v0.5.0-aura-debug.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.1-aura-${{ github.run_number }}
          name: SARA Obsidian Aura Continuous Voice v0.5.1 (Build #${{ github.run_number }})
          body: |
            SARA Personal AI Assistant — v0.5.1 Continuous Voice Mode & Female Voice Upgrade (Obsidian + Crimson Aura).
            - **Continuous Voice Mode**: One-tap ON/OFF continuous voice session; automatically resumes listening after AI replies and handles natural pauses silently until stopped
            - **Zero-Beep Recognizer**: Eliminates SpeechRecognizer start/stop pop/beep sounds without muting SARA's spoken voice
            - **Female Bengali Voices Fixed**: Fixes Android native male `-bnd-`/`-ban-` misidentification, differentiates all 6 female voice personas cleanly, and preserves 24kHz Gemini Neural TTS
            - **Background & Screen-Off + Auto-Reconnect**: Single microphone session lock, `PARTIAL_WAKE_LOCK` support, and `ConnectivityManager` network auto-reconnect
            - Package: `com.sara.assistant`
          files: SARA-v0.5.0-aura-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
